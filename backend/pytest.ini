[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --strict-markers -v --tb=short

markers =
    unit: Unit tests focusing on isolated business logic without DB/external side effects
    integration: Integration tests between Router, Service, and Test Database layers
    smoke: Fast sanity checks for core application endpoints and startup
    e2e: Complete end-to-end customer journey and campaign execution workflows
    regression: Bug regression tests ensuring legacy issues do not reoccur
